# CI gate: the same checks the local release scripts run, enforced on every
# push and PR so a red build can't reach main unnoticed. Mirrors:
#   * frontend:  tsc -b   (the authoritative frontend correctness check)
#   * backend:   byte-compile every Python module
#   * pipeline:  scripts/preflight_pipeline.py (imports, catalog, manifest+schema)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check (tsc -b)
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Byte-compile backend + scripts + pipeline
        run: python -m py_compile backend/*.py scripts/*.py upgrades-pipeline/*.py
      - name: Pipeline pre-flight (catalog + manifest + schema)
        run: |
          pip install jsonschema
          python scripts/preflight_pipeline.py
