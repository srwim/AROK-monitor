# Manual-trigger catalog enrichment: pulls manufacturer og:image thumbnails
# into parts_catalog.json (tier 1) for parts Open Icecat doesn't cover, then
# commits the result. Run it after adding parts or productUrls; the regular
# verify-thumbnails workflow reports remaining gaps.
name: Enrich parts catalog

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # lets the final step dispatch the manifest refresh

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enrich catalog from manufacturer pages
        working-directory: upgrades-pipeline
        env:
          ICECAT_SHOPNAME: ${{ secrets.ICECAT_SHOPNAME }}
          ICECAT_API_TOKEN: ${{ secrets.ICECAT_API_TOKEN }}
        run: python enrich_catalog.py | tee "$GITHUB_STEP_SUMMARY"

      # Uncompressed source image -> compressed renditions + catalog tags.
      # Produces thumbs/<slug>.webp (lossless full, lightbox) and
      # thumbs/<slug>.thumb.webp (160px card rendition) for every part with a
      # source; idempotent via imageHash.
      - name: Process images (compress, resize, tag)
        working-directory: upgrades-pipeline
        env:
          ICECAT_SHOPNAME: ${{ secrets.ICECAT_SHOPNAME }}
          ICECAT_API_TOKEN: ${{ secrets.ICECAT_API_TOKEN }}
        run: |
          pip install Pillow
          python process_images.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit catalog + processed images if changed
        id: commit
        run: |
          git config user.name  "arok-catalog-bot"
          git config user.email "actions@github.com"
          git add upgrades-pipeline/parts_catalog.json upgrades-pipeline/thumbs
          if git diff --cached --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: enrich catalog + compress thumbnail renditions"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The manifest bakes catalog images in at generation time, so a manifest
      # built before this run's commit would miss the new thumbnails (the
      # ordering race we hit on 2026-07-10). Chain the refresh automatically
      # whenever the catalog actually changed.
      - name: Refresh the manifest with the new images
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main
