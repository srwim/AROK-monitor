# Daily refresh of the Hardware Upgrades manifest. Runs the generator and
# commits manifest.json (+ the bundled frontend fallback) so the app's
# Upgrades tab gets fresh picks/builds without an app update.
#
# NOTE: GitHub disables scheduled workflows after ~60 days without repo
# activity. The failure step below covers *failing* runs, not disabled ones —
# if the manifest stops updating with no issue filed, check the Actions tab.
name: Update Hardware Upgrades manifest

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: upgrades-pipeline
        run: pip install -r requirements.txt

      - name: Generate manifest
        working-directory: upgrades-pipeline
        env:
          AMAZON_TAG: lifeupgrad02b-20
          ICECAT_SHOPNAME: ${{ secrets.ICECAT_SHOPNAME }}
          ICECAT_API_TOKEN: ${{ secrets.ICECAT_API_TOKEN }}
        run: python build_manifest.py

      - name: Report thumbnail coverage
        run: |
          python - <<'PY'
          import json
          m = json.load(open("upgrades-pipeline/manifest.json"))
          comps = [c for s in m["featuredSystems"] for c in s["components"]]
          img = sum(1 for c in comps if c.get("image"))
          print(f"Icecat thumbnails resolved: {img}/{len(comps)} build components")
          PY

      - name: Sync bundled fallback copy
        run: cp upgrades-pipeline/manifest.json frontend/public/manifest.json

      - name: Commit if changed
        run: |
          git config user.name  "arok-manifest-bot"
          git config user.email "actions@github.com"
          git add upgrades-pipeline/manifest.json frontend/public/manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "chore: daily Hardware Upgrades manifest refresh"
          # Push with rebase + retry. A scheduled run can overlap a manual one (or
          # a human can push) and advance main between our checkout and push, which
          # rejects a naive push. Rebase onto the newer remote — keeping our freshly
          # generated manifest on any conflict — and retry up to 5 times.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - rebasing onto newer remote ..."
            git pull --rebase -X theirs origin main || true
          done
          echo "Could not push the manifest refresh after 5 attempts." >&2
          exit 1

      # If anything above failed, file (or bump) an issue so the failure is
      # never silent — issue creation triggers a normal GitHub notification.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The daily Hardware Upgrades manifest refresh failed.\n\nRun: ${runUrl}`;
            const open = await github.rest.issues.listForRepo({owner, repo, state: "open", labels: "manifest-failure"});
            if (open.data.length) {
              await github.rest.issues.createComment({owner, repo, issue_number: open.data[0].number, body});
            } else {
              await github.rest.issues.create({owner, repo, title: "Manifest refresh workflow failed", body, labels: ["manifest-failure"]});
            }
